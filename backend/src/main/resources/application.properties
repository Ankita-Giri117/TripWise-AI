spring.application.name=tripwise-backend
server.port=${PORT:8080}

# Database — values supplied by environment variables in production, or application-local.properties in local dev
spring.datasource.url=${TRIPWISE_DB_URL:postgresql://neondb_owner:npg_EIziT40YnZrv@ep-holy-grass-b4iiu6ew-pooler.c-6.us-east-2.aws.neon.tech/tripwise?sslmode=require&channel_binding=require}
spring.datasource.username=${TRIPWISE_DB_USERNAME:neondb_owner}
