spring.application.name=tripwise-backend
server.port=${PORT:8080}

# Database — values supplied by environment variables in production, or application-local.properties in local dev
spring.datasource.url=${TRIPWISE_DB_URL}
spring.datasource.username=${TRIPWISE_DB_USERNAME}
spring.datasource.password=${TRIPWISE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration — supply TRIPWISE_JWT_SECRET in environment or application-local.properties
app.jwt.secret=${TRIPWISE_JWT_SECRET}
app.jwt.expiration-ms=${TRIPWISE_JWT_EXPIRATION_MS:86400000}

# AI (OpenRouter) Configuration — supply TRIPWISE_OPENROUTER_API_KEY in environment or application-local.properties
app.ai.api-key=${TRIPWISE_OPENROUTER_API_KEY}
app.ai.model=${TRIPWISE_AI_MODEL:openrouter/free}

# CORS Configuration — comma-separated list of allowed origins (e.g. https://your-frontend.vercel.app)
app.cors.allowed-origins=${TRIPWISE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Active profile — defaults to local when unconfigured, can be overridden by SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}